# Port 80 serves the Windows browser. The private listener preserves A's source IP.
Listen 172.30.250.3:8081

<VirtualHost *:80 172.30.250.3:8081>
    DocumentRoot /var/www/glpi/public

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory /var/www/glpi/public>
        Require all granted
        RewriteEngine On

        # Pass the Authorization header through to GLPI and keep its normal routing.
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
</VirtualHost>
